[package]
name = "nuwa"
version = "0.17.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nuwa（女娲）— issue in, PR out. Repair runner over the vendored rpi harness."

[[bin]]
name = "nuwa"
path = "src/main.rs"

[dependencies]
rpi-agent = { workspace = true }
rpi-ai = { workspace = true, features = ["providers"] }
rpi-tools = { workspace = true }
rpi-harness = { workspace = true }
shanhaijing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
libc = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
anyhow = "1"
async-trait = { workspace = true }
reqwest = { workspace = true }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
regex = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
axum-extra = { workspace = true }
cookie = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
tempfile = { workspace = true }
ts-rs = { version = "10", optional = true, features = ["serde-json-impl"] }

[features]
# `cargo test -p nuwa --features ts-export export_bindings` 把 API DTO 导出成
# web/src/lib/api-types/*.ts（CI 的 types job 负责提交基线）。
ts-export = ["dep:ts-rs", "shanhaijing/ts-export"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
