[package]
name = "nuwa"
version = "0.8.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nuwa（女娲）— issue in, PR out. Repair runner over the vendored rpi harness."

[[bin]]
name = "nuwa"
path = "src/main.rs"

[dependencies]
rpi-agent = { workspace = true }
rpi-ai = { workspace = true, features = ["providers"] }
rpi-tools = { workspace = true }
rpi-harness = { workspace = true }
shanhaijing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
anyhow = "1"
reqwest = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
axum-extra = { workspace = true }
cookie = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
