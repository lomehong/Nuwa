name: hang-probe

# Manual diagnostic for the same-process parallel test hang (docs/07 §D).
# First run nextest (per-test process + per-test deadline): a hung test is
# killed and reported by name, and the job still finishes with logs. If that
# passes, run libtest in parallel with live output; a hang there leaves the
# last started test name in the step log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      NUWA_BUILD_COMMIT: hang-probe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web console (embedded fixtures)
        working-directory: web
        run: npm ci && npm run build
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: nextest parallel probe (bounded; names a hung test)
        run: cargo nextest run -p nuwa --bin nuwa --profile hang-probe
      - name: libtest parallel probe (live output)
        if: success()
        timeout-minutes: 20
        run: cargo test -p nuwa --bin nuwa -- --test-threads=2 --nocapture
