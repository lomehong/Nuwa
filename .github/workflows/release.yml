name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nuwa-linux-x64
          - os: windows-latest
            artifact: nuwa-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p nuwa
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/nuwa.exe ]; then
            cp target/release/nuwa.exe "dist/${{ matrix.artifact }}.exe"
          else
            cp target/release/nuwa "dist/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh resolves the repo from git context — without a checkout it fails
      # with "not a git repository".
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/**/* --generate-notes --title "${{ github.ref_name }}"
