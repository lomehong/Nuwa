name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  gate:
    # 发版不重复跑测试（冷缓存 runner 曾两次挂死），但必须证明 tag 指向的
    # 提交已有绿色 ci.yml。tag 前应先等 main CI 绿；这里再用 API 兜底。
    runs-on: ubuntu-latest
    steps:
      - name: require green ci.yml for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # 冷缓存时 CI 全量（vendored 1662+）在 runner 上需要 40-60 分钟；
          # nextest 曾出现测试子进程树卡死（runner 沙箱）导致 CI 长时间
          # in_progress——gate 等待预算与之匹配（60 分钟），CI 完成后按
          # 结论立即判定（绿→发布、红→失败），不再固定 10 次假超时。
          for attempt in $(seq 1 120); do
            body=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20")
            state=$(printf '%s' "$body" | jq -r --arg sha "$SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)] as $runs
              | if any($runs[]; .conclusion == "success") then "success"
                elif any($runs[]; .status == "in_progress" or .status == "queued"
                       or .status == "waiting" or .status == "requested") then "pending"
                elif ($runs | length) == 0 then "none"
                else "failed" end')
            case "$state" in
              success)
                echo "ci.yml is green for ${SHA}"
                exit 0
                ;;
              failed)
                echo "::error::ci.yml for ${SHA} did not succeed"
                exit 1
                ;;
            esac
            echo "waiting for ci.yml on ${SHA} (${state}, attempt ${attempt}/120)"
            sleep 30
          done
          echo "::error::no green ci.yml run found for ${SHA}"
          exit 1

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nuwa-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nuwa-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: nuwa-linux-x64-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web dependencies
        working-directory: web
        run: npm ci
      # `web/dist` (gitignored) must exist before rust-embed compiles the
      # release binary. Web tests/build must stop the tag before packaging;
      # Rust tests are gated by ci.yml on the same commit (release runners
      # hung twice in 2026-10-26, so do not duplicate the suite here).
      - name: test and build web console
        working-directory: web
        run: npm run typecheck && npm run lint && npm test && npm run build
      - name: fmt (self-owned crates)
        run: cargo fmt --check -p nuwa -p shanhaijing
      - name: clippy (self-owned crates)
        # musl 变体只负责静态构建与冒烟；host 编译门已由 gnu/msvc 覆盖。
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo clippy --no-deps -p nuwa -p shanhaijing --all-targets -- -D warnings
      # 不在 release 重复跑 Rust 测试：tag 指向的 commit 必须已有绿色 CI
      # （ci.yml 跑全 workspace）；release runner 的冷缓存测试步曾两次挂死且
      # timeout 未生效（2026-10-26）。这里只保留构建与静态冒烟。
      - run: cargo build --release -p nuwa --target ${{ matrix.target }}
        env:
          # 编译期注入版本指纹：/api/v1/system 的 build_commit（tag 构建时是
          # tag 指向的提交）。
          NUWA_BUILD_COMMIT: ${{ github.sha }}
          # 只对 musl 目标生效；其他目标忽略这两个变量。
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - name: static smoke (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/nuwa"
          file "$bin"
          # static-pie 的 file 文案是 "static-pie linked"；用 PT_INTERP 判定
          # 更可靠：静态产物不应有动态加载器。
          if readelf -l "$bin" | grep -q "INTERP"; then
            echo "::error::musl build has a dynamic interpreter"
            exit 1
          fi
          "$bin" status --db "$(mktemp -d)/smoke.db" > /dev/null
      - name: package
        shell: bash
        run: |
          test -f web/dist/index.html
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/nuwa"
          if [ -f "$bin.exe" ]; then
            cp "$bin.exe" "dist/${{ matrix.artifact }}.exe"
          else
            cp "$bin" "dist/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh resolves the repo from git context — without a checkout it fails
      # with "not a git repository".
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/**/* --generate-notes --title "${{ github.ref_name }}"
