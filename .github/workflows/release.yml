name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nuwa-linux-x64
          - os: windows-latest
            artifact: nuwa-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web dependencies
        working-directory: web
        run: npm ci
      # `web/dist` (gitignored) must exist before rust-embed compiles the
      # release binary. Test failures must stop the tag before packaging.
      - name: test and build web console
        working-directory: web
        run: npm run typecheck && npm run lint && npm test && npm run build
      - name: fmt (self-owned crates)
        run: cargo fmt --check -p nuwa -p shanhaijing
      - name: clippy (self-owned crates)
        run: cargo clippy --no-deps -p nuwa -p shanhaijing --all-targets -- -D warnings
      - name: tests (workspace)
        timeout-minutes: 20
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo test --workspace -- --test-threads=1 --nocapture \
              --skip execution_env_conformance::os_cancel_interrupts_even_when_timeout_is_set
          else
            cargo test --workspace -- --test-threads=1 --nocapture
          fi
      - run: cargo build --release -p nuwa
        env:
          # 编译期注入版本指纹：/api/v1/system 的 build_commit（tag 构建时是
          # tag 指向的提交）。
          NUWA_BUILD_COMMIT: ${{ github.sha }}
      - name: package
        shell: bash
        run: |
          test -f web/dist/index.html
          mkdir -p dist
          if [ -f target/release/nuwa.exe ]; then
            cp target/release/nuwa.exe "dist/${{ matrix.artifact }}.exe"
          else
            cp target/release/nuwa "dist/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh resolves the repo from git context — without a checkout it fails
      # with "not a git repository".
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/**/* --generate-notes --title "${{ github.ref_name }}"
