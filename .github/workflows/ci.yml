name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (self-owned crates — zero-warning bar)
        run: cargo clippy -p nuwa -p shanhaijing --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/qingniao-go/go.mod
      - name: vet + tests
        working-directory: sdk/qingniao-go
        run: |
          go vet ./...
          go test ./...
