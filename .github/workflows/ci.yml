name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # 编译期注入；/api/v1/system 的 build_commit 由此而来（默认 "dev"）。
      NUWA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # vendored 补丁检查要 diff 到基线 tag 的 commit，浅克隆取不到。
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # check-arch 调用 cargo metadata，必须在上面的 toolchain 之后。
      - name: 架构契约（crate/模块依赖方向）
        run: python3 scripts/check-arch.py
      - name: 需求—设计—实现追溯
        run: python3 scripts/check-traceability.py
      - name: vendored 补丁清单
        run: python3 scripts/check-vendored.py
      - uses: Swatinem/rust-cache@v2
      # rust-embed 在 release/CI 下编译期嵌入 web/dist——serve 的架构图页
      # 测试断言嵌入产物可访问，因此 rust job 必须先产出前端（与
      # release.yml 的构建前置一致）。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web console (embedded fixtures)
        working-directory: web
        run: npm ci && npm run build
      - name: fmt (self-owned crates — rustfmt clean)
        # vendored crates keep their upstream style (AGENTS.md rule 1);
        # only the self-owned crates are gated.
        run: cargo fmt --check -p nuwa -p shanhaijing
      - name: clippy (self-owned crates — zero-warning bar)
        # --no-deps: the command-line -D would otherwise propagate into the
        # vendored workspace members and flag their known unwraps.
        run: cargo clippy --no-deps -p nuwa -p shanhaijing --all-targets -- -D warnings
      # 2026-10-23/10-26 的测试挂死（CI 并行、release gnu 串行）都表现为
      # “无限等待且取消困难”。nextest 为每个测试起独立进程，并在
      # .config/nextest.toml 的 ci profile 里给 120s 硬超时：挂死会以测试名
      # 失败，而不是拖住整个 job。串行仍保留，根因待查（docs/07）。
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: doctests
        timeout-minutes: 10
        run: cargo test --workspace --doc
      # 全场景 faux 基准：每个内嵌场景都必须 base 红/分支绿，负对照必须被门禁拦住。
      - name: benchmark (faux scenarios)
        timeout-minutes: 10
        run: |
          cargo run -p nuwa -- benchmark run --provider faux --db /tmp/bench.db --json > /tmp/bench.raw
          sed -n '/^{/,$p' /tmp/bench.raw > /tmp/bench.json
          if ! jq -e 'all(.results[]; (.error == null) and (if .expected_fixed then (.repaired and .delivery_ok) else ((.repaired|not) and (.delivery_ok|not)) end))' /tmp/bench.json; then
            echo "::error::benchmark scenarios regressed:"
            jq -r '.results[] | select(.error != null or (if .expected_fixed then ((.repaired|not) or (.delivery_ok|not)) else (.repaired or .delivery_ok) end)) | "\(.scenario): expected_fixed=\(.expected_fixed) repaired=\(.repaired) delivery=\(.delivery_ok) error=\(.error)"' /tmp/bench.json
            exit 1
          fi

  # 全量 nextest 拆到两个独立 runner（matrix）。
  # 根因（docs/07 §D，2026-10-29 四个 run 实证）：单个 hosted runner 上
  # nextest 串行/-j 2 都在 run 开始后 ~47 分钟整 runner 失联（失败 step
  # 为空、日志 BlobNotFound、磁盘清理无效）——每测试独立进程 + 测试内
  # spawn 的 git/go 子进程渐进累积，触发 runner 任务/进程上限后 agent
  # fork 失败死亡。单 runner 全量必然撞墙，拆分让每个 runner 只承担
  # ~20 分钟测试量，远离墙。
  rust-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [vendored, own-1, own-2, own-3]
    env:
      NUWA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web console (embedded fixtures)
        working-directory: web
        run: npm ci && npm run build
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: free disk space (~30GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /usr/share/swift /opt/pipx || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /
      - name: tests (nextest — per-test process + timeout)
        # 挂死测试由 nextest 的 per-test 120s 硬超时兜底；预算 120 分钟
        # 防冷缓存误杀。own 再按 hash 分 3 区（每 runner ~15 分钟），远离
        # 进程耗尽墙（vendored 纯单元单 runner 已实证可全量跑完）。
        timeout-minutes: 120
        run: |
          case "${{ matrix.suite }}" in
            vendored)
              cargo nextest run --workspace --exclude nuwa --exclude shanhaijing --profile ci -j 2 ;;
            own-1)
              cargo nextest run -p nuwa -p shanhaijing --profile ci -j 2 --partition hash:1/3 ;;
            own-2)
              cargo nextest run -p nuwa -p shanhaijing --profile ci -j 2 --partition hash:2/3 ;;
            own-3)
              cargo nextest run -p nuwa -p shanhaijing --profile ci -j 2 --partition hash:3/3 ;;
          esac

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: tests
        run: npm test
      - name: build
        run: npm run build

  audit:
    # RustSec 公告库比对。独立 job：不拖慢主流程，也能在 PR 上单独看到结果。
    # 只读 Cargo.lock，不编译任何 crate。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RUSTSEC advisories)
        run: cargo audit

  musl:
    # 静态产物：部署到旧 glibc 或无 libc 的容器时不依赖运行时。
    # 只构建 + 冒烟，不重复跑全量测试（gnu/windows 的 CI 已覆盖）。
    runs-on: ubuntu-latest
    env:
      NUWA_BUILD_COMMIT: ${{ github.sha }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web console (embedded)
        working-directory: web
        run: npm ci && npm run build
      - name: build static binary
        run: cargo build --release -p nuwa --target x86_64-unknown-linux-musl
      - name: verify static + smoke
        run: |
          bin=target/x86_64-unknown-linux-musl/release/nuwa
          file "$bin"
          # static-pie 的 file 文案是 "static-pie linked"；用 PT_INTERP 判定
          # 更可靠：静态产物不应有动态加载器。
          if readelf -l "$bin" | grep -q "INTERP"; then
            echo "::error::musl build has a dynamic interpreter"
            exit 1
          fi
          db="$(mktemp -d)/smoke.db"
          "$bin" status --db "$db" > /dev/null
          test -s "$db"
      - name: upload static binary (runner images)
        uses: actions/upload-artifact@v4
        with:
          name: nuwa-musl
          path: target/x86_64-unknown-linux-musl/release/nuwa

  docker:
    # 用 musl 产物构建 runner 镜像矩阵，验证 Dockerfile 与工具链组合。
    # 推送到 registry 是所有者动作，CI 不发布镜像。
    needs: musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nuwa-musl
          path: docker
      - name: build image matrix
        run: |
          chmod +x docker/nuwa
          docker build -f docker/runner-base.Dockerfile -t nuwa-runner-base:local .
          for stack in go rust node python; do
            docker build -f "docker/runner-$stack.Dockerfile" -t "nuwa-runner-$stack:local" .
          done
      - name: smoke base image
        run: |
          tmp="$(mktemp -d)"
          chmod 777 "$tmp"
          docker run --rm -v "$tmp:/data" nuwa-runner-base:local status --db /data/smoke.db
          test -s "$tmp/smoke.db"

  types:
    # API DTO → 前端 TypeScript 类型的单一来源：ts-rs 只在 `ts-export` feature
    # 下编译（生产构建零负担）。main 上生成并自动提交基线；PR 上只校验
    # "生成结果与仓库一致"，防止手写类型漂移。
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: export TS bindings
        env:
          TS_RS_EXPORT_DIR: ${{ github.workspace }}/web/src/lib/api-types
        run: cargo test -p nuwa --features ts-export export_bindings
      - name: normalize generated types
        # ts-rs maps u64/i64 to `bigint`, while JSON always yields numbers; its
        # commented-field formatting can also leave trailing spaces. Both must
        # be normalized so the committed generated baseline stays reproducible.
        run: |
          grep -rl 'bigint' web/src/lib/api-types | xargs -r sed -i 's/\bbigint\b/number/g'
          sed -i 's/[[:space:]]\+$//' web/src/lib/api-types/*.ts
      - name: commit on main / verify on PR
        run: |
          # 首次生成的文件是 untracked，`git diff` 看不见它们——必须先 add。
          git add -A -- web/src/lib/api-types
          if [ -z "$(ls -A web/src/lib/api-types 2>/dev/null)" ]; then
            echo "::error::ts-rs produced no files — the export filter matched nothing"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "types are up to date"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            git config user.name "nuwa-types-bot"
            git config user.email "nuwa@localhost"
            git commit -m "chore(types): 重新生成前端 API 类型 [skip ci]"
            git push
          else
            echo "::error::generated TS types are stale — run \`cargo test -p nuwa --features ts-export export_bindings\` and commit web/src/lib/api-types"
            git diff --cached --stat -- web/src/lib/api-types
            exit 1
          fi
