name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendored 补丁检查要 diff 到基线 tag 的 commit，浅克隆取不到。
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # check-arch 调用 cargo metadata，必须在上面的 toolchain 之后。
      - name: 架构契约（crate/模块依赖方向）
        run: python3 scripts/check-arch.py
      - name: vendored 补丁清单
        run: python3 scripts/check-vendored.py
      - uses: Swatinem/rust-cache@v2
      # rust-embed 在 release/CI 下编译期嵌入 web/dist——serve 的架构图页
      # 测试断言嵌入产物可访问，因此 rust job 必须先产出前端（与
      # release.yml 的构建前置一致）。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web console (embedded fixtures)
        working-directory: web
        run: npm ci && npm run build
      - name: clippy (self-owned crates — zero-warning bar)
        # --no-deps: the command-line -D would otherwise propagate into the
        # vendored workspace members and flag their known unwraps.
        run: cargo clippy --no-deps -p nuwa -p shanhaijing --all-targets -- -D warnings
      # 串行 + 不捕获：2026-10-23 run #54 在并行模式下卡死过一次（最后启动的
      # `verify::tests::star_pem_...` 30+ 分钟无输出，取消也停不下来）。串行
      # 让卡死点可见，也避开了并行下的资源竞争；timeout-minutes 保证下次卡死
      # 15 分钟就失败而不是挂满 6 小时。并行死锁本身仍是待查项（docs/07）。
      - name: tests
        timeout-minutes: 15
        run: cargo test --workspace -- --test-threads=1 --nocapture

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: tests
        run: npm test
      - name: build
        run: npm run build
